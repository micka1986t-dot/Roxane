# Plume Libre sur Render : un service web Node + une base Postgres.
services:
  - type: web
    name: plume-libre
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PSEUDOS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: plume-libre-db
          property: connectionString
databases:
  - name: plume-libre-db
    region: frankfurt
    plan: free
