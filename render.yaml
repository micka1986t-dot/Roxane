# Mille Plumes sur Render : un service web Node + une base Postgres.
# ADMIN_PSEUDOS (pseudos modérateurs) se règle à part, dans l'onglet Environment du service.
services:
  - type: web
    name: mille-plumes
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plume-libre-db
          property: connectionString
databases:
  - name: plume-libre-db
    region: frankfurt
    plan: free
