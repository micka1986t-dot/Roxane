<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mille Plumes</title>
<meta name="theme-color" content="#1D1A33">
<meta name="description" content="Écris et lis des histoires, gratuitement.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mille Plumes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout : une "bibliothèque de nuit" — barre haute avec le choix Jeunesse/Adulte, étagères de couvertures, pages de lecture étroites */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --surface-2:#EDE9F5; --ink:#1D1A33; --muted:#6A6585; --line:#DCD6EA;
  --accent:#D3336A; --accent-ink:#FFFFFF; --mint:#1F9C86; --gold:#E2A21B; --warn-bg:#FFF2D6; --warn-ink:#7A5200;
  --f-display:"Gloock", Georgia, serif; --f-body:"Figtree", system-ui, sans-serif; --f-read:"Lora", Georgia, serif;
  --r:10px; --shadow:0 8px 24px rgba(29,26,51,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121F; --surface:#1E1B2E; --surface-2:#282440; --ink:#EEEAF8; --muted:#A39DBD; --line:#36314F;
  --accent:#FF5C8F; --accent-ink:#1A0610; --mint:#4FD1B5; --gold:#F2BC45; --warn-bg:#3A2E10; --warn-ink:#F6D48A;
  --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121F; --surface:#1E1B2E; --surface-2:#282440; --ink:#EEEAF8; --muted:#A39DBD; --line:#36314F;
  --accent:#FF5C8F; --accent-ink:#1A0610; --mint:#4FD1B5; --gold:#F2BC45; --warn-bg:#3A2E10; --warn-ink:#F6D48A;
  --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.logo{font-family:var(--f-display);font-size:26px;text-decoration:none;display:flex;align-items:center;gap:8px;line-height:1}
.logo svg{width:26px;height:26px;color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;padding:7px 11px;border-radius:8px;font-weight:600;color:var(--muted)}
nav.main a.on,nav.main a:hover{color:var(--ink);background:var(--surface-2)}
nav.main a.prem{color:var(--gold)}
.me-chip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none}

/* Bandeau démo */
.demo-band{background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
.demo-band .wrap{padding-block:6px}

main{padding-block:28px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05}
h2{font-size:26px;line-height:1.15}
h3{font-size:19px}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:#2A1C00;border-color:var(--gold)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}

/* Accueil */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin-bottom:34px}
.hero p{font-size:17px;max-width:52ch;color:var(--muted);margin:14px 0 18px}
.hero-shelf{display:flex;gap:12px;justify-content:center;align-items:flex-end}
.hero-shelf .cover{width:120px}
.hero-shelf .cover:nth-child(2){width:140px;transform:translateY(-10px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
select,input[type=text],input[type=search],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
textarea{width:100%;resize:vertical}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 20px;margin-top:20px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:8px}
.card .cover{transition:transform .2s}
.card:hover .cover{transform:translateY(-4px) rotate(-1deg)}
.card h3{font-size:17px;line-height:1.2}
.card .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.j{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.tag.a{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Couverture */
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:var(--shadow),inset 6px 0 0 rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:space-between;padding:12% 10% 9%;isolation:isolate;container-type:inline-size}
.cover .pat{position:absolute;inset:0;z-index:-1}
.cover .shape{position:absolute;z-index:-1}
.cover .ct{font-size:13cqi;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.cover .ca{font-size:7cqi;text-align:center;letter-spacing:.06em;opacity:.9;font-family:var(--f-body);font-weight:600}

/* Page histoire */
.story-head{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:start}
.story-head .info{display:flex;flex-direction:column;gap:12px;min-width:0}
.author-line{display:flex;align-items:center;gap:10px}
.author-line a{font-weight:700}
.chap-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.chap-list button{border:0;background:none;text-align:left;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
.chap-list button:first-child{border-top:0}
.chap-list button:hover,.chap-list button.on{background:var(--surface-2)}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,5vw,48px);margin-top:26px}
.reader article{max-width:62ch;margin:0 auto;font-family:var(--f-read);font-size:18px;line-height:1.75}
.reader article p{margin:0 0 1.1em}
.reader h2{text-align:center;margin-bottom:24px;max-width:62ch;margin-inline:auto}
.reader .nav{display:flex;justify-content:space-between;max-width:62ch;margin:24px auto 0;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;margin-top:34px}
.cols>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.review{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.review:first-of-type{border-top:0;padding-top:0}
.review .who{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.star-input{display:flex;gap:2px}
.star-input button{border:0;background:none;font-size:28px;cursor:pointer;color:var(--line);padding:0 2px;line-height:1}
.star-input button.on{color:var(--gold)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink)}
.note.ok{background:var(--surface-2);color:var(--ink)}
.report{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}

/* Auteur */
.author-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.author-head .avatar{width:84px;height:84px;font-size:32px;font-family:var(--f-display)}
.stats{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.post{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.post time{font-size:12px;color:var(--muted)}

/* Atelier d'écriture */
.studio{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.studio>*{min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:700;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chap-edit{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.designer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:14px}
.designer .cover{width:200px;margin:0 auto}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.opt-row{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);font-weight:700}
.ai-box{border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}

/* Premium + noms */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:22px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.plan.best{border:2px solid var(--gold)}
.plan .price{font-family:var(--f-display);font-size:34px}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.name-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.name-card[aria-pressed="true"]{border:2px solid var(--accent)}
.name-card .n{font-family:var(--f-display);font-size:26px;line-height:1.1}

/* Modale + toast */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{padding-block:20px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}

@media (max-width:820px){
  .hero,.cols,.studio{grid-template-columns:1fr}
  .story-head{grid-template-columns:130px 1fr;gap:18px}
  .designer{position:static}
}

/* Notifications, cases à cocher, code de secours, pages légales */
.bell{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--ink);text-decoration:none}
.bell:hover{background:var(--surface-2)}
.bell svg{width:22px;height:22px}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;flex:none;width:18px;height:18px}
.pw{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:16px}
.code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;letter-spacing:.12em;text-align:center;padding:14px;border:2px dashed var(--accent);border-radius:10px;background:var(--surface-2);user-select:all}
.panel.notif-list{gap:0;padding:0;overflow:hidden}
.notif{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.notif:first-child{border-top:0}
.notif.unread{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.notif:hover{background:var(--surface-2)}
.notif .ni{font-size:20px;line-height:1.2}
.notif .nt{display:flex;flex-direction:column;gap:2px;min-width:0}
.notif time{font-size:12px;color:var(--muted)}
.legal{max-width:68ch;margin:0 auto}
.legal h1{margin:6px 0 14px}
.legal h2{font-size:21px;margin:26px 0 8px}
.legal .lead{font-size:17px;color:var(--muted)}
.legal ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
footer .links a{color:inherit}
.tabbar{display:none}
.demo-band .short{display:none}
/* ---------- Version mobile : barre d'onglets en bas, en-tête compact ---------- */
@media (max-width:760px){
  body{font-size:15px}
  nav.main{display:none}
  header.top .wrap{flex-wrap:nowrap;justify-content:space-between;padding-block:8px}
  .logo{font-size:21px;min-width:0}
  .logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button{padding:6px 11px;font-size:14px}
  .demo-band .long{display:none}.demo-band .short{display:inline}
  .demo-band{font-size:12px;text-align:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;align-items:flex-end}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;min-width:0}
  .tabbar a svg{width:24px;height:24px}
  .tabbar a.on{color:var(--accent)}
  .tabbar a.write svg{width:46px;height:46px;padding:11px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin-top:-22px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent)}
  .tabbar a.write.on{color:var(--accent)}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  footer{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  main{padding-bottom:24px}
  .bell{margin-left:auto;order:2}
  header.top .seg{order:3}
  header.top .wrap{gap:8px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .modal{align-items:end;padding:0}
  .modal .box{border-radius:18px 18px 0 0;max-width:none;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
  /* Accueil */
  .hero{margin-bottom:18px;gap:0}
  .hero-shelf{display:none}
  .hero h1{font-size:32px}
  .hero p{font-size:15px;margin:10px 0 14px}
  .hero .row{flex-wrap:nowrap}
  .hero .row .btn{flex:1;justify-content:center;white-space:nowrap;padding:10px 12px;font-size:14px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:10px calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:0 max(16px,env(safe-area-inset-left,0px)) 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;flex:none}
  .toolbar{padding-top:14px}
  .toolbar>.row{width:100%;flex-wrap:nowrap}
  .toolbar input[type=search]{flex:1;min-width:0}
  .toolbar select{flex:none}
  #sort{width:100%}
  /* Lecture */
  .reader{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));border-radius:0;border-inline:0;padding:26px max(18px,env(safe-area-inset-left,0px))}
  .reader article{font-size:17px;line-height:1.7}
  .reader .nav{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);padding-top:10px}
  .reader .nav .btn{flex:1;justify-content:center}
  .panel{padding:16px}
  .star-input button{font-size:34px}
  /* Écriture : couverture d'abord, en ligne */
  .studio{gap:20px}
  .designer .cover{width:150px}
  .row>.btn.primary#publish{flex:1;justify-content:center}
  input[type=text],input[type=search],input[type=email],select,textarea{font-size:16px}
  .author-head{gap:14px}
  .author-head .avatar{width:64px;height:64px;font-size:26px}
  .stats{gap:16px}
}
@media (max-width:480px){
  .logo svg{display:none}
  .logo{font-size:20px}
  .seg button{padding:6px 9px}
  .story-head{grid-template-columns:110px 1fr;gap:14px}
  .story-head .info h1{font-size:26px}
  .story-head .info>p{grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .hero-shelf .cover{width:90px}.hero-shelf .cover:nth-child(2){width:105px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#explorer" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3c-7 1-12 6-14 14l-2 4"/><path d="M20 3c0 6-3 11-9 13"/><path d="M8 13h5"/></svg>
      <span id="siteName">Mille Plumes</span>
    </a>
    <div class="seg" role="group" aria-label="Section">
      <button id="secJ" aria-pressed="true">Jeunesse</button>
      <button id="secA" aria-pressed="false">Adulte</button>
    </div>
    <nav class="main" id="mainNav">
      <a href="#explorer" data-r="explorer">Explorer</a>
      <a href="#ecrire" data-r="ecrire">Écrire</a>
      <a href="#espace" data-r="espace">Mon espace</a>
